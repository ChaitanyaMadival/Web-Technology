<body>

    <h1>Passport Seva</h1>
    <div>
        <form action="" style="">
            <label for="">Register to apply at*</label>
            <input type="radio" name="passport" id="">CPV Delhi
            <input type="radio" name="passport">Passport Office
        </form>
    </div>
    <br>

    <div>
        <form action="">
            <label for="passport">Passport Office * </label>
            <select name="" id="passport">
                <option value="">--Select--</option>
                <option value="">Karnataka</option>
                <option value="">Kerala</option>
                <option value="">Chennai</option>
                <option value="">Mumbai</option>
            </select>
        </form>
    </div>
     <br>

    <div>
        <form action="">
            <label for="name" >Given Name</label>
            <input type="text" id="name">
        </form>
    </div>
     <br>

    <div>
        <form action="">
            <label for="sur">Surname</label>
            <input type="text" id="sur">
        </form>
    </div>
     <br>

     <div>
        <label for="date">Date of Birth (DD/MM/YYYY)*</label>
        <input type="text" placeholder="DD/MM/YYYY" id="date">
     </div>
      <br>


    <div>
        <form action="">
            <label for="mail">E-mail Id*</label>
            <input type="text" id="mail">
        </form>
    </div>
     <br>

    <div><form action="">
        <label for="">Do you want your Login Id to be same as E-mail Id?</label>
        <input type="radio" name="login" id="">Yes
        <input type="radio" name="login">No
         </form>
    </div>
     <br>

    <div>
        <form action="">
            <label for="logg">Login Id*</label>
            <input type="text" id="logg">
        </form>
    </div>
     <br>

    <div>
        <form action="">
            <label for="pass">Password*</label>
            <input type="text" id="pass">
        </form>
    </div>
     <br>

    <div>
        <form action="">
            <label for="con">Conform Password*</label>
            <input type="text" id="con">
        </form>
    </div>
     <br>

    <div>
        <form action="">
            <label for="hint">Hint Question</label>
            <select name="" id="hint">
            <option value="">---Select---</option>
            <option value="">birth city</option>
            <option value="">favrite color</option>
            <option value="">favrite food</option>
            <option value="">first school</option>
            </select>
            
        </form>

     <br>

    <div>
        <button>Register</button>
        <button>Clear</button>
    </div>
